[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "1.0.0"
description = "End-to-end RAG chatbot over PDFs using LlamaIndex, OpenAI and AWS Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "llama-index-core>=0.11",
  "llama-index-readers-file>=0.2",
  "llama-index-llms-openai>=0.2",
  "llama-index-embeddings-openai>=0.2",
  "llama-index-llms-bedrock-converse>=0.3",
  "llama-index-embeddings-bedrock>=0.3",
  "llama-index-retrievers-bm25>=0.4",
  "pypdf>=4.0",
  "boto3>=1.34",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ragbot = "ragbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
